<div class="card">

<script>
  // ↓ 新しい Supabase プロジェクト(wine-expert-quest)の値に置き換える
  const SUPABASE_URL = "https://vbpcfjrthczdgdgncisg.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZicGNmanJ0aGN6ZGdkZ25jaXNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNTkxMTgsImV4cCI6MjEwNTczNTExOH0.OEuN9E1DBQxU6XSFvK7SWc88B9FBmR5GBNx9e-f3LjQ";

  // ==== LEVEL-LOGIC-BEGIN ====
  // DOM・Supabase に依存しない純粋関数だけを置く区間。tools/test-level.js がこの区間を読み込んでテストする。

  // J.S.A. ワインエキスパート一次試験 出題分野(11分類。categories マスタと対応)
  const fieldNames = {
    intro: "ワイン概論",
    france: "フランス",
    italy: "イタリア",
    spain_portugal: "スペイン・ポルトガル",
    germany_austria: "ドイツ・オーストリア・他欧州",
    new_world: "ニューワールド",
    japan: "日本",
    other_drinks: "酒類飲料概論",
    tasting: "テイスティング",
    service_cheese: "サービス・チーズ・料理",
    law: "酒類の法規・表示"
  };

  // 分野の出題比重(合計100)。推定得点率の加重平均と模試の出題配分に使う
  const FIELD_WEIGHTS = {
    france: 22, intro: 15, italy: 10, new_world: 9, japan: 8, other_drinks: 8,
    spain_portugal: 7, germany_austria: 7, service_cheese: 6, tasting: 4, law: 4
  };

  // 難易度: 1=基礎用語 / 2=産地・品種の対応 / 3=細かい数値・法規
  const diffLabels = { 1: "基礎用語", 2: "産地・品種", 3: "数値・法規" };
  const expTable = {
    1: { correct: 6,  incorrect: 1 },
    2: { correct: 10, incorrect: 2 },
    3: { correct: 16, incorrect: 3 }
  };

  // 総合レベル: EXP で上がるが、推定得点率(習熟度)で上限をかける。Lv100 ＝ 筆記試験合格ライン
  const PASS_LEVEL = 100;
  const RECENT_WINDOW = 30;          // 分野ごとの「直近」問題数
  const PASS_RATE = 0.78;            // Lv100 に必要な推定得点率(合格ライン約7割 + 安全マージン)
  const MIN_ANSWERS_PER_FIELD = 30;  // Lv100 に必要な各分野の回答数
  const CORE_FIELDS = ['france', 'intro'];
  const CORE_RATE = 0.75;            // 高比重分野それぞれに必要な直近正答率
  const LEVEL_CAPS = [               // 推定得点率が below 未満ならレベル上限 cap
    { below: 0.60, cap: 59 },
    { below: 0.70, cap: 79 },
    { below: 0.75, cap: 89 },
    { below: PASS_RATE, cap: 99 }
  ];

  // Lv N→N+1 に必要なEXP。Lv100 まで累計 19,602 EXP(≒ 2,000問前後)
  function xpToNext(level) { return 100 + 2 * (level - 1); }
  function calcExpLevel(totalExp) {
    let level = 1, remain = Math.max(0, totalExp || 0);
    while (level < PASS_LEVEL && remain >= xpToNext(level)) { remain -= xpToNext(level); level++; }
    return { level: level, intoLevel: remain, need: xpToNext(level) };
  }

  // logs: [{ question_id, category_id, is_correct, created_at }]
  // 分野ごとの累計回答数と、直近 RECENT_WINDOW 問の正答率(未回答なら rate = null)
  function fieldStats(logs) {
    const stats = {};
    Object.keys(fieldNames).forEach(id => { stats[id] = { total: 0, correct: 0, recent: [] }; });
    const sorted = logs.slice().sort((a, b) => Date.parse(a.created_at) - Date.parse(b.created_at));
    for (const log of sorted) {
      const s = stats[log.category_id];
      if (!s) continue;
      s.total++;
      if (log.is_correct) s.correct++;
      s.recent.push(!!log.is_correct);
      if (s.recent.length > RECENT_WINDOW) s.recent.shift();
    }
    for (const id in stats) {
      const s = stats[id];
      s.recentTotal = s.recent.length;
      s.recentCorrect = s.recent.filter(Boolean).length;
      s.rate = s.recentTotal > 0 ? s.recentCorrect / s.recentTotal : null;
      delete s.recent;
    }
    return stats;
  }

  // 推定得点率: 分野別の直近正答率を比重で加重平均(未回答の分野は 0 として扱う)
  function estimateScore(stats) {
    let sum = 0, wsum = 0;
    for (const id in FIELD_WEIGHTS) {
      sum += FIELD_WEIGHTS[id] * (stats[id].rate || 0);
      wsum += FIELD_WEIGHTS[id];
    }
    return Math.round(sum / wsum * 10000) / 10000;   // 浮動小数の誤差で 0.7 が 0.6999… にならないよう丸める
  }

  // Lv100 に届かない理由の一覧(空なら到達可能)
  function passBlockers(stats, estimate) {
    const out = [];
    if (estimate < PASS_RATE) {
      out.push('推定得点率 ' + Math.round(estimate * 100) + '% → ' + Math.round(PASS_RATE * 100) + '% 以上が必要');
    }
    for (const id of CORE_FIELDS) {
      const r = stats[id].rate || 0;
      if (r < CORE_RATE) out.push(fieldNames[id] + ' の直近正答率 ' + Math.round(r * 100) + '% → ' + Math.round(CORE_RATE * 100) + '% 以上が必要');
    }
    const short = Object.keys(fieldNames).filter(id => stats[id].total < MIN_ANSWERS_PER_FIELD);
    if (short.length > 0) {
      out.push('回答数 ' + MIN_ANSWERS_PER_FIELD + '問未満の分野: ' + short.map(id => fieldNames[id] + '(' + stats[id].total + ')').join('、'));
    }
    return out;
  }

  function levelCap(stats, estimate) {
    for (const c of LEVEL_CAPS) {
      if (estimate < c.below) return c.cap;
    }
    return passBlockers(stats, estimate).length === 0 ? PASS_LEVEL : PASS_LEVEL - 1;
  }

  // 弱点分野: 合格ライン未満の分野を「比重 × 合格ラインとの差」の大きい順に
  function weakFields(stats, limit) {
    return Object.keys(FIELD_WEIGHTS)
      .filter(id => stats[id].rate === null || stats[id].rate < PASS_RATE)
      .map(id => ({ id: id, rate: stats[id].rate, impact: FIELD_WEIGHTS[id] * (PASS_RATE - (stats[id].rate || 0)) }))
      .sort((a, b) => b.impact - a.impact)
      .slice(0, limit || 3);
  }

  function calcOverallLevel(totalExp, logs) {
    const exp = calcExpLevel(totalExp);
    const stats = fieldStats(logs || []);
    const estimate = estimateScore(stats);
    const cap = levelCap(stats, estimate);
    return {
      level: Math.min(exp.level, cap),
      expLevel: exp.level,
      cap: cap,
      capped: exp.level > cap,
      intoLevel: exp.intoLevel,
      need: exp.need,
      estimate: estimate,
      stats: stats,
      weak: weakFields(stats, 3),
      blockers: passBlockers(stats, estimate)
    };
  }

  // 復習対象: 最後に解いたときに不正解だった問題の id
  function latestWrongIds(logs) {
    const last = {};
    const sorted = logs.slice().sort((a, b) => Date.parse(a.created_at) - Date.parse(b.created_at));
    for (const log of sorted) last[log.question_id] = !!log.is_correct;
    return Object.keys(last).filter(id => !last[id]);
  }

  // 模試の出題配分: total 問を比重どおりに割り振る(最大剰余法)。在庫不足の分野の分は残りの分野へ再配分
  function allocateByWeight(total, available) {
    const ids = Object.keys(FIELD_WEIGHTS);
    const cap = id => available[id] || 0;
    const alloc = {};
    ids.forEach(id => { alloc[id] = 0; });
    let left = Math.min(total, ids.reduce((s, id) => s + cap(id), 0));
    let active = ids.filter(id => cap(id) > 0);
    while (left > 0 && active.length > 0) {
      const wsum = active.reduce((s, id) => s + FIELD_WEIGHTS[id], 0);
      const shares = active.map(id => {
        const exact = left * FIELD_WEIGHTS[id] / wsum;
        return { id: id, n: Math.floor(exact), rem: exact - Math.floor(exact) };
      });
      let extra = left - shares.reduce((s, x) => s + x.n, 0);
      shares.sort((a, b) => (b.rem - a.rem) || (FIELD_WEIGHTS[b.id] - FIELD_WEIGHTS[a.id]));
      for (const s of shares) { if (extra > 0) { s.n++; extra--; } }
      for (const s of shares) {
        const add = Math.min(s.n, cap(s.id) - alloc[s.id]);
        alloc[s.id] += add;
        left -= add;
      }
      active = active.filter(id => alloc[id] < cap(id));
    }
    return alloc;
  }

  // キャラクターの段階(0〜6)
  const TIER_NAMES = ["ぶどうの芽", "みならい", "セラー番", "テイスター", "ワイン通", "エキスパート候補", "ワインエキスパート"];
  const TIER_FROM = [1, 15, 30, 50, 70, 90, 100];
  function heroTier(level) {
    let t = 0;
    for (let i = 0; i < TIER_FROM.length; i++) if (level >= TIER_FROM[i]) t = i;
    return t;
  }

  if (SUPABASE_URL.indexOf('__') === 0) {

  let totalExp = 0;              // 全分野の累計EXP

  function shuffle(arr) {

  // ---- データ取得 ----
  // Supabase(PostgREST)は1回の取得が最大1000行なので、ページングして全件取る
  async function fetchAllRows(buildQuery) {
    const PAGE = 1000;
    let rows = [];
    for (let from = 0; ; from += PAGE) {
      const { data, error } = await buildQuery().range(from, from + PAGE - 1);
      if (error) throw error;
      rows = rows.concat(data || []);
      if (!data || data.length < PAGE) return rows;
    }
  }

  // ---- 日別正答率チャート ----
  let dashboardLogs = [];
  let chartRange = 'week';   // 'week' = 直近7日間 / 'month' = 直近30日間 / 'year' = 直近12か月(月別)

  function setChartRange(range) {
    chartRange = range;
    renderChartSection();
  }

  function localDateKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function computeDailyAccuracy(logs, days) {
    const today = new Date();
    const buckets = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      buckets.push({ key: localDateKey(d), label: (d.getMonth() + 1) + '/' + d.getDate(), total: 0, correct: 0 });
    }
    const map = {};
    buckets.forEach(b => { map[b.key] = b; });
    for (const log of logs) {
      const b = map[localDateKey(new Date(log.created_at))];
      if (b) {
        b.total++;
        if (log.is_correct) b.correct++;
      }
    }
    return buckets.map(b => ({
      label: b.label,
      total: b.total,
      accuracy: b.total > 0 ? Math.round(b.correct / b.total * 1000) / 10 : null
    }));
  }

  // 表示幅に収まるよう、固定の論理幅で描いて width=100% で縮尺する
  // 直近 months か月を月ごとに集計(年間表示用)
  function computeMonthlyAccuracy(logs, months) {
    const today = new Date();
    const buckets = [];
    for (let i = months - 1; i >= 0; i--) {
      const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
      buckets.push({ key: d.getFullYear() + '-' + d.getMonth(), label: (d.getMonth() + 1) + '月', total: 0, correct: 0 });
    }
    const map = {};
    buckets.forEach(b => { map[b.key] = b; });
    for (const log of logs) {
      const t = new Date(log.created_at);
      const b = map[t.getFullYear() + '-' + t.getMonth()];
      if (b) {
        b.total++;
        if (log.is_correct) b.correct++;
      }
    }
    return buckets.map(b => ({
      label: b.label,
      total: b.total,
      accuracy: b.total > 0 ? Math.round(b.correct / b.total * 1000) / 10 : null
    }));
  }

  function renderAccuracyChartSvg(buckets) {
    const dense = buckets.length > 14;
    const w = 320;
    const padLeft = 26;   // 目盛りラベル(0%/50%/100%)用の余白
    const slot = (w - padLeft) / buckets.length;
    const barW = slot * (dense ? 0.7 : 0.6);
    const gap = slot - barW;
    const chartH = 120;
    const padTop = 16, padBottom = 20;
    const h = chartH + padTop + padBottom;

    const gridLines = [0, 50, 100].map(pct => {
      const y = padTop + chartH * (1 - pct / 100);
      return `<line x1="${padLeft}" y1="${y}" x2="${w}" y2="${y}" stroke="#4a2d3a" stroke-width="1" stroke-dasharray="2,3"/>`
        + `<text x="0" y="${y + 3}" font-size="9" fill="#8a6f7a">${pct}%</text>`;
    }).join('');

    const labelEvery = dense ? 5 : 1;
    const bars = buckets.map((b, i) => {
      const x = padLeft + i * slot + gap / 2;
      const hasData = b.accuracy !== null;
      const barH = hasData ? Math.max(2, chartH * (b.accuracy / 100)) : 2;
      const y = padTop + chartH - barH;
      const color = hasData ? '#d4a64a' : '#4a2d3a';
      const title = hasData ? (b.label + ': ' + b.accuracy + '% (' + b.total + '問)') : (b.label + ': 記録なし');
      const showLabel = (i % labelEvery === 0) || i === buckets.length - 1;
      const labelSvg = showLabel
        ? `<text x="${x + barW / 2}" y="${h - 6}" font-size="9" fill="#8a6f7a" text-anchor="middle">${b.label}</text>`
        : '';
      const valueSvg = (hasData && !dense)
        ? `<text x="${x + barW / 2}" y="${y - 4}" font-size="9" fill="#b8a1ab" text-anchor="middle">${b.accuracy}%</text>`
        : '';
      return `<g><title>${escapeHtml(title)}</title><rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="3" fill="${color}"/>${valueSvg}${labelSvg}</g>`;
    }).join('');

    return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block; height:auto;">${gridLines}${bars}</svg>`;
  }

  function renderChartSection() {
    const area = document.getElementById('accuracyChartArea');
    if (!area) return;
    const buckets = chartRange === 'year'

  // 分野レベル計算:累計EXPから現在のレベルを算出
  // レベルN→N+1に必要なEXP = N * 100 (累積)
  function calcLevel(totalExp) {
    let level = 1;
    let remaining = totalExp;
    while (remaining >= level * 100) {
      remaining -= level * 100;
      level++;
    }
    return level;
  }

  // 回答を Supabase に記録し、分野・総合レベルの変化を返す(直列実行)
  function recordAnswer(q, key) {
    const job = recordQueue.then(() => doRecordAnswer(q, key));
    recordQueue = job.catch(() => {});
    return job;
  }

  async function doRecordAnswer(q, key) {
    const isCorrect = (key === q.official_answer);
    const expInfo = expTable[q.difficulty || 2] || expTable[2];
    const expGained = isCorrect ? expInfo.correct : expInfo.incorrect;
    const result = { fieldLevelUp: null, overallMsg: null };

    const before = calcOverallLevel(totalExp, allLogs);

    // 1. answer_logs に記録
    const { error } = await sb.from('answer_logs').insert({
      user_id: currentUser.id,
      question_id: q.id,
      user_answer: key,
      is_correct: isCorrect,
      exp_gained: expGained
    });
    if (error) throw error;
    allLogs.push({ question_id: q.id, category_id: q.category_id, is_correct: isCorrect, created_at: new Date().toISOString() });

    // 2. 分野(category_id)ごとに field_status を更新
    const fieldId = q.category_id;
    const { data: existing } = await sb
      .from('field_status')
      .select('*')
      .eq('user_id', currentUser.id)
      .eq('field_id', fieldId)
      .maybeSingle();

    const prevExp = existing ? existing.exp : 0;
    const newExp = prevExp + expGained;
    const prevLevel = existing ? existing.level : 1;
    const newLevel = calcLevel(newExp);
    const fieldRate = calcOverallLevel(0, allLogs).stats[fieldId].rate;

    await sb.from('field_status').upsert({
      user_id: currentUser.id,
      field_id: fieldId,
      exp: newExp,
      level: newLevel,
      mastery_rate: fieldRate === null ? 0 : Math.round(fieldRate * 1000) / 1000,
      updated_at: new Date().toISOString()
    });

    if (newLevel > prevLevel) {
      result.fieldLevelUp = "🎉 " + (fieldNames[fieldId] || fieldId) + " が Lv." + newLevel + " にレベルアップ!";
    }

    // 3. 総合レベル(EXP と推定得点率の上限の小さいほう)
    totalExp += expGained;
    const after = calcOverallLevel(totalExp, allLogs);
    if (after.level > before.level) {
      result.overallMsg = after.level >= PASS_LEVEL
        ? "🏆 総合レベルが Lv." + after.level + " に到達!筆記試験の合格ラインです!"
        : "⭐ 総合レベルが Lv." + after.level + " に上がった!";
    } else if (after.capped && !before.capped) {
      result.overallMsg = "🔒 推定得点率 " + pct(after.estimate) + "% のため Lv." + after.cap + " で足止め中。正答率を上げると解放されます";
    }
    renderHero();
    return result;
  }

  async function selectChoice(key) {
    if (answered) return;
    answered = true;
    answeredCount++;

    const q = questions[currentIndex];
    const isCorrect = (key === q.official_answer);
    const difficulty = q.difficulty || 2;
    const expInfo = expTable[difficulty] || expTable[2];
    const expGained = isCorrect ? expInfo.correct : expInfo.incorrect;

    for (const k in q.choices) {
      const btn = document.getElementById('choice-' + k);
      btn.disabled = true;
      if (k === q.official_answer) {
        btn.classList.add('correct');
      } else if (k === key) {
        btn.classList.add('incorrect');
      }
    }

    const resultBox = document.getElementById('resultBox');
    const resultTitle = document.getElementById('resultTitle');
    const expGain = document.getElementById('expGain');
    const explanationText = document.getElementById('explanationText');
    const levelUpText = document.getElementById('levelUpText');

    if (isCorrect) {
      resultTitle.innerText = "✅ 正解!";
      resultTitle.className = "result-title correct-text";
    } else {
      resultTitle.innerText = "❌ 不正解";
      resultTitle.className = "result-title incorrect-text";
    }
    expGain.innerText = "+" + expGained + " EXP（" + (diffLabels[difficulty] || "産地・品種") + "）";
    explanationText.innerText = q.explanation;
    resultBox.style.display = "block";
    renderDeepDive(q);

    try {
      const r = await recordAnswer(q, key);
      if (r.fieldLevelUp && levelUpText) {
        levelUpText.innerText = r.fieldLevelUp;
        levelUpText.style.display = "block";
      }
      const el = document.getElementById('overallLevelUp');
      if (r.overallMsg && el) {
        el.innerText = r.overallMsg;
        el.style.display = "block";
      }
    } catch (e) {
      console.error("記録エラー:", e);
    }
  }

  // ---- 総合レベル & キャラクター ----
  function renderHero() {
    const info = calcOverallLevel(totalExp, allLogs);
    const tier = heroTier(info.level);
    const svgEl = document.getElementById('heroSvg');
    const titleEl = document.getElementById('heroTitle');
    const fillEl = document.getElementById('heroBarFill');
    const subEl = document.getElementById('heroSub');
    if (!svgEl) return;
    svgEl.innerHTML = heroSvg(info.level);
    titleEl.innerHTML = '<span class="lv">Lv.' + info.level + '</span> ' + TIER_NAMES[tier];
    const est = '推定得点率 ' + pct(info.estimate) + '%';
    if (info.level >= PASS_LEVEL) {
      fillEl.style.width = '100%';
      subEl.innerText = "合格ライン到達! " + est + " ／ 累計 " + totalExp + " EXP";
    } else if (info.capped) {
      fillEl.style.width = '100%';
      subEl.innerText = "🔒 上限 Lv." + info.cap + "(" + est + ")／ EXP上は Lv." + info.expLevel + " 相当";
    } else {
      fillEl.style.width = Math.min(100, Math.round(info.intoLevel / info.need * 100)) + '%';
      subEl.innerText = "次のLvまで " + (info.need - info.intoLevel) + " EXP ／ " + est
        + (info.weak.length > 0 ? " ／ 弱点: " + fieldNames[info.weak[0].id] : "");
    }
  }

  // レベル帯で装備が変わるゆるキャラ(インラインSVG・ぶどうのマスコット)
  function heroSvg(level) {
    const t = heroTier(level);
    const p = [];
    if (t >= 5) p.push('<path d="M30 40 Q19 70 26 86 L74 86 Q81 70 70 40 Z" fill="#7f1d1d"/>');
    // 胴体
    p.push('<rect x="30" y="34" width="40" height="44" rx="18" fill="#e9d5ff"/>');
    p.push('<ellipse cx="40" cy="80" rx="6" ry="4" fill="#a78bab"/><ellipse cx="60" cy="80" rx="6" ry="4" fill="#a78bab"/>');
    // おなかのぶどうエンブレム
    p.push('<g fill="#7e22ce" opacity="0.9"><circle cx="46" cy="58" r="3"/><circle cx="54" cy="58" r="3"/><circle cx="50" cy="63" r="3"/><circle cx="46" cy="63" r="2.4"/><circle cx="54" cy="63" r="2.4"/><circle cx="50" cy="68" r="2.6"/></g>');
    p.push('<path d="M50 55 q2 -4 5 -4" stroke="#15803d" stroke-width="1.4" fill="none"/>');
    // 顔
    p.push('<circle cx="43" cy="46" r="2.6" fill="#1a0e13"/><circle cx="57" cy="46" r="2.6" fill="#1a0e13"/>');
    p.push('<circle cx="38" cy="51" r="3" fill="#fca5a5" opacity="0.65"/><circle cx="62" cy="51" r="3" fill="#fca5a5" opacity="0.65"/>');
    p.push('<path d="M46 52 q4 4 8 0" stroke="#1a0e13" stroke-width="1.6" fill="none" stroke-linecap="round"/>');
    // 右手: ワイングラス(段階で中身と輝きが増える)
    if (t === 0) p.push('<rect x="72" y="44" width="3" height="22" rx="1.5" fill="#a16207"/>');
    else {
      p.push('<path d="M68 38 h12 q0 12 -6 13 q-6 -1 -6 -13 Z" fill="#f8fafc" opacity="0.85"/><rect x="73.2" y="51" width="1.6" height="9" fill="#f8fafc"/><rect x="70" y="60" width="8" height="1.8" rx="0.9" fill="#f8fafc"/>');
      if (t >= 2) p.push('<path d="M68.6 43 h10.8 q-0.6 7 -5.4 8 q-4.8 -1 -5.4 -8 Z" fill="#9f1239"/>');
      if (t >= 4) p.push('<circle cx="74" cy="44" r="12" fill="#facc15" opacity="0.15"/>');
    }
    // 左手: 装備
    if (t === 1) p.push('<circle cx="26" cy="58" r="7" fill="#a16207" stroke="#7c2d12" stroke-width="1.5"/>');
    else if (t === 2) p.push('<circle cx="25" cy="58" r="9" fill="#94a3b8" stroke="#475569" stroke-width="2"/>');
    else if (t === 3 || t === 4) p.push('<path d="M25 47 l10 4 v9 q0 8 -10 12 q-10 -4 -10 -12 v-9 Z" fill="#9f1239" stroke="#7f1d1d" stroke-width="1.5"/>');
    else if (t >= 5) p.push('<path d="M25 45 l11 4 v10 q0 9 -11 13 q-11 -4 -11 -13 v-10 Z" fill="#9f1239" stroke="#eab308" stroke-width="2"/>');
    // 頭装備
    if (t === 1) p.push('<path d="M44 34 q6 -8 12 0 Z" fill="#16a34a"/>');
    else if (t === 2) p.push('<path d="M32 36 q18 -12 36 0 Z" fill="#7c2d12"/>');
    else if (t === 3) p.push('<path d="M33 36 q17 -13 34 0 Z" fill="#581c87"/><rect x="48" y="32" width="4" height="10" fill="#581c87"/>');
    else if (t === 4) p.push('<path d="M33 35 q17 -13 34 0 Z" fill="#9f1239"/><circle cx="50" cy="27" r="3" fill="#d4a64a"/>');
    else if (t === 5) p.push('<path d="M34 34 l4 -10 l6 8 l6 -10 l6 10 l6 -8 l4 10 Z" fill="#facc15" stroke="#eab308" stroke-width="1"/>');
    else if (t === 6) {
      p.push('<path d="M34 34 l4 -11 l6 8 l6 -11 l6 11 l6 -8 l4 11 Z" fill="#facc15" stroke="#eab308" stroke-width="1"/>');
      p.push('<circle cx="70" cy="24" r="6" fill="#22c55e"/><path d="M67 24 l2 2 l4 -4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>');
      p.push('<text x="16" y="26" font-size="11">✨</text>');
    }
    return '<svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true">' + p.join('') + '</svg>';
  }

  // ---- 模試モード ----
  let mock = null;   // { list, index, answers: [key|null], endAt, timerId, minutes }

  function renderMockIntro() {
    stopMockTimer();
    const container = document.getElementById('quizContent');
    container.innerHTML = `
      <div class="continue-box">
        <div class="continue-title">📝 模試モード</div>
        <div class="continue-sub">
          分野の出題比重どおりに出題します。<br>
          解説は最後にまとめて表示。回答は通常どおり記録され、EXP も入ります。<br>
          ※ 本番の問題数・試験時間は年度で変わることがあります。
        </div>
        <button onclick="startMock(${MOCK_FULL.count}, ${MOCK_FULL.minutes})">本番形式(${MOCK_FULL.count}問・${MOCK_FULL.minutes}分)</button>
        <button class="secondary" onclick="startMock(${MOCK_MINI.count}, ${MOCK_MINI.minutes})">ミニ模試(${MOCK_MINI.count}問・${MOCK_MINI.minutes}分)</button>
        <button class="secondary" onclick="renderDashboard()">戻る</button>
      </div>
    `;
  }

  async function startMock(count, minutes) {
    const container = document.getElementById('quizContent');
    container.innerHTML = '<div class="loading">問題を準備中...</div>';
    let pool;
    try {
      pool = await fetchQuestions();
    } catch (error) {
      container.innerHTML = '<div class="loading">問題の読み込みに失敗しました: ' + escapeHtml(error.message) + '</div>';
      return;
    }
    const byField = {};
    for (const q of pool) (byField[q.category_id] = byField[q.category_id] || []).push(q);
    const available = {};
    for (const id in byField) available[id] = byField[id].length;
    const alloc = allocateByWeight(count, available);
    let list = [];
    for (const id in alloc) list = list.concat(shuffle(byField[id] || []).slice(0, alloc[id]));
    if (list.length === 0) {
      container.innerHTML = '<div class="loading">問題が登録されていません。</div>';
      return;
    }
    // 問題数が足りないときは時間を按分する
    const mins = Math.max(1, Math.round(minutes * list.length / count));
    mock = { list: shuffle(list), index: 0, answers: [], endAt: Date.now() + mins * 60000, timerId: null, minutes: mins };
    mock.timerId = setInterval(tickMock, 1000);
    renderMockQuestion();
  }

  function stopMockTimer() {
    if (mock && mock.timerId) {
      clearInterval(mock.timerId);
      mock.timerId = null;
    }
  }

  function formatRemain(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function tickMock() {
    if (!mock) return;
    const remain = mock.endAt - Date.now();
    const el = document.getElementById('mockTimer');
    if (el) {
      el.innerText = '残り ' + formatRemain(remain);
      el.className = 'mock-timer' + (remain < 5 * 60000 ? ' low' : '');
    }
    if (remain <= 0) finishMock(true);
  }

  function renderMockQuestion() {
    const q = mock.list[mock.index];
    const container = document.getElementById('quizContent');
    container.innerHTML = `
      <div class="mock-bar">
        <span>模試 ${mock.index + 1} / ${mock.list.length} 問</span>
        <span id="mockTimer" class="mock-timer">残り ${formatRemain(mock.endAt - Date.now())}</span>
      </div>
      ${questionHeaderHtml(q)}
      <div class="question-body">${escapeHtml(q.body)}</div>
      <div id="choicesArea">${choicesHtmlFor(q, 'selectMockChoice')}</div>
      <button class="secondary" onclick="if (confirm('ここで終了して採点しますか?(未回答は不正解扱い)')) finishMock(false)">終了して採点</button>
    `;
  }

  function selectMockChoice(key) {
    if (!mock || mock.answers[mock.index] !== undefined) return;
    const q = mock.list[mock.index];
    mock.answers[mock.index] = key;
    recordAnswer(q, key).catch(e => console.error("記録エラー:", e));
    mock.index++;
    if (mock.index >= mock.list.length) finishMock(false);
    else renderMockQuestion();
  }

  async function finishMock(timeUp) {
    if (!mock) return;
    stopMockTimer();
    const m = mock;
    mock = null;
    const container = document.getElementById('quizContent');
    container.innerHTML = '<div class="loading">採点中...</div>';
    try { await recordQueue; } catch (_) {}

    const per = {};
    let correct = 0;
    const wrongs = [];
    m.list.forEach((q, i) => {
      const a = m.answers[i];
      const ok = a === q.official_answer;
      const p = per[q.category_id] = per[q.category_id] || { total: 0, correct: 0 };
      p.total++;
      if (ok) { p.correct++; correct++; }
      else wrongs.push({ q: q, a: a });
    });
    const rate = correct / m.list.length;
    const passed = rate >= 0.7;

    const rowsHtml = Object.keys(fieldNames).filter(id => per[id]).map(id => `
      <div class="dashboard-row">
        <div class="dashboard-row-name">${fieldNames[id]}</div>
        <div class="dashboard-row-stats">${per[id].correct} / ${per[id].total}</div>
      </div>`).join('');

    const wrongHtml = wrongs.map(w => `
      <details class="mock-wrong">
        <summary>${escapeHtml(w.q.body)}</summary>
        <div style="margin-top:8px;">あなたの回答: ${w.a ? w.a + '. ' + escapeHtml(w.q.choices[w.a]) : '未回答'}</div>
        <div style="color:#4ade80;">正解: ${w.q.official_answer}. ${escapeHtml(w.q.choices[w.q.official_answer])}</div>
        <div class="explanation">${escapeHtml(w.q.explanation)}</div>
      </details>`).join('');

    container.innerHTML = `
      <div class="dashboard-summary">
        <div class="dashboard-summary-title">${timeUp ? '⏰ 時間切れ — ' : ''}模試の結果</div>
        <div class="dashboard-summary-stats">
          <div><span class="dashboard-num">${correct}/${m.list.length}</span>正解</div>
          <div><span class="dashboard-num">${pct(rate)}</span>% 得点率</div>
        </div>
        <div class="dashboard-note">${passed ? '🎉 合格目安(約7割)を超えました。' : '合格目安(約7割)まで あと ' + Math.max(0, Math.ceil(m.list.length * 0.7) - correct) + '問。'}</div>
      </div>
      <div class="dashboard-title">分野別</div>
      <div class="dashboard-list">${rowsHtml}</div>
      <div class="dashboard-title">間違えた問題(${wrongs.length}問・タップで解説)</div>
      ${wrongHtml || '<div class="deepdive-empty">全問正解!</div>'}
      <button onclick="renderDashboard()">ホームに戻る</button>
    `;
  }

  // ---- 解説の深掘り学習 ----
  function buildPrompt(q, doubt) {
    let choicesText = "";
    for (const key in q.choices) {
      choicesText += key + ". " + q.choices[key] + "\n";
    }
    return (
      "J.S.A. ワインエキスパート一次試験(筆記)対策の問題です。解説の内容で分からない点があります。\n\n" +
      "【問題】\n" + q.body + "\n\n" +
      "【選択肢】\n" + choicesText + "\n" +
      "【正解】" + q.official_answer + "\n\n" +
      "【解説】\n" + (q.explanation || "") + "\n\n" +
      "【私の疑問】\n" + doubt + "\n\n" +
      "初学者にも分かるように、私の疑問に答えてください。産地名・品種名はカタカナと原語を併記し、年度で変わりうる数値や法規は最新の日本ソムリエ協会教本で確認が必要な旨も添えてください。"
    );
  }

  function showDeepDiveMsg(text, isError) {
    const el = document.getElementById('deepDiveMsg');
    if (!el) return;
    el.innerText = text;
    el.style.color = isError ? '#f87171' : '#4ade80';
  }

  function renderDeepDive(q) {
    const area = document.getElementById('deepDiveArea');
    if (!area) return;
    area.innerHTML = `
      <div class="deepdive">
        <div class="deepdive-title">🔍 この解説を深掘りする</div>
        <div id="deepDiveHistory" class="deepdive-history"><div class="deepdive-empty">読み込み中...</div></div>
        <label class="deepdive-label" for="doubtInput">疑問を入力</label>
        <textarea id="doubtInput" class="deepdive-textarea" placeholder="例: なぜアは不正解なのか?"></textarea>
        <button class="deepdive-btn" onclick="copyPrompt()">📋 プロンプトをコピー</button>
        <div class="deepdive-links">
          <a class="deepdive-link" href="https://claude.ai/new" target="_blank" rel="noopener">Claude.aiを開く</a>
          <a class="deepdive-link" href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPTを開く</a>
        </div>
        <label class="deepdive-label" for="answerInput">AIの回答を貼り付け</label>
        <textarea id="answerInput" class="deepdive-textarea" placeholder="コピペ先で得た回答をここに貼り付け"></textarea>
        <button class="deepdive-btn save" onclick="saveDeepDive()">💾 保存する</button>
        <div id="deepDiveMsg" class="deepdive-msg"></div>
      </div>
    `;
    loadDeepDiveHistory(q.id);
  }

  async function loadDeepDiveHistory(questionId) {
    const box = document.getElementById('deepDiveHistory');
    if (!box) return;
    const { data, error } = await sb
      .from('chat_messages')
      .select('*')
      .eq('question_id', questionId)
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: true });

    if (error) {
      box.innerHTML = '<div class="deepdive-empty">履歴の読み込みに失敗しました</div>';
      return;
    }
    if (!data || data.length === 0) {
      box.innerHTML = '<div class="deepdive-empty">まだやり取りはありません</div>';
      return;
    }
    let html = "";
    for (const m of data) {
      const isUser = (m.role === 'user');
      html +=
        '<div class="dd-msg ' + (isUser ? 'dd-user' : 'dd-assistant') + '">' +
          '<div class="dd-role">' + (isUser ? '❓ 疑問' : '💡 回答') + '</div>' +
          '<div class="dd-content">' + escapeHtml(m.content) + '</div>' +
        '</div>';
    }
    box.innerHTML = html;
  }

  async function copyPrompt() {
    const q = questions[currentIndex];
    const doubt = (document.getElementById('doubtInput').value || '').trim();
    if (!doubt) {
      showDeepDiveMsg('先に疑問を入力してください', true);
      return;
    }
    const text = buildPrompt(q, doubt);
    try {
      await navigator.clipboard.writeText(text);
      showDeepDiveMsg('コピーしました。Claude.aiまたはChatGPTに貼り付けてください', false);
      return;
    } catch (e) {
      // フォールバック(古いSafari / 非セキュアコンテキスト)
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
      showDeepDiveMsg(ok ? 'コピーしました' : 'コピーに失敗しました。手動で選択してコピーしてください', !ok);
    }
  }

  async function saveDeepDive() {
    const q = questions[currentIndex];
    const doubt = (document.getElementById('doubtInput').value || '').trim();
    const answer = (document.getElementById('answerInput').value || '').trim();
    if (!doubt || !answer) {
      showDeepDiveMsg('疑問と回答の両方を入力してください', true);
      return;
    }
    const now = Date.now();
    const { error } = await sb.from('chat_messages').insert([
      { user_id: currentUser.id, question_id: q.id, role: 'user', content: doubt, created_at: new Date(now).toISOString() },
      { user_id: currentUser.id, question_id: q.id, role: 'assistant', content: answer, created_at: new Date(now + 1).toISOString() }
    ]);
    if (error) {
      showDeepDiveMsg('保存に失敗しました: ' + error.message, true);
      return;
    }
    document.getElementById('doubtInput').value = '';
    document.getElementById('answerInput').value = '';
    showDeepDiveMsg('保存しました', false);
    loadDeepDiveHistory(q.id);
  }
  // ---- ここまで ----

  function nextQuestion() {
    // ASK_EVERY問ごとに継続確認を挟む
    if (answeredCount > 0 && answeredCount % ASK_EVERY === 0) {
      showContinuePrompt();
      return;
    }
    advanceQuestion();
  }

  function advanceQuestion() {
    if (quizMode === 'review' && currentIndex + 1 >= questions.length) {
      const container = document.getElementById('quizContent');
      container.innerHTML = `
        <div class="continue-box">
          <div class="continue-title">復習完了 🍷</div>
          <div class="continue-sub">${questions.length}問を見直しました。<br>まだ間違えた問題は次回の復習に残ります。</div>
          <button onclick="renderDashboard()">ホームに戻る</button>
        </div>
      `;
      return;
    }
    currentIndex = (currentIndex + 1) % questions.length;
    renderQuestion();
  }

  function showContinuePrompt() {
    const container = document.getElementById('quizContent');
    container.innerHTML = `
      <div class="continue-box">
        <div class="continue-title">${answeredCount}問 回答しました 🎉</div>
        <div class="continue-sub">このまま続けますか?</div>
        <button onclick="advanceQuestion()">続ける</button>
        <button class="secondary" onclick="pauseSession()">いったん終了</button>
      </div>
    `;
  }

  function pauseSession() {
    const container = document.getElementById('quizContent');
    container.innerHTML = `
      <div class="continue-box">
        <div class="continue-title">おつかれさまでした</div>
        <div class="continue-sub">今回は ${answeredCount}問 回答しました。<br>いつでも再開できます。</div>
        <button onclick="advanceQuestion()">再開する</button>
      </div>
    `;
  }

  checkUser();
</script>
